{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% include "partials/theme_head.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Oakbound Trust Bank</title>
    <link rel="icon" href="{% static 'favicons/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'favicons/favicon.ico' %}" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'favicons/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'favicons/site.webmanifest' %}">
    <meta name="theme-color" content="#4A3020">

    <style>
        .material-symbols-rounded {
            cursor: pointer;
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 48
        }
    </style>

    <!-- Google symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=chevron_right&display=swap">

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'reset.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href={% static 'responsive.css' %}">

    <script src="Country+State+District-City-Data.js"></script>
    
    <link rel="stylesheet" href="{% static 'css/theme.css' %}?v=9">
</head>
<body class="ob-legacy ob-auth">
    
    {% include 'partials/nav.html' %}

    <!-- Sign up section -->
    <section id="signup-form-section">
        <div class="container signup">
            <div class="vector-div">
                <img src="images/signup-image.svg">
            </div>

            <div class="signup-form">
                <h2>Personal information</h2>
                <form class="forms">
                    <!-- SSN -->
                    <div class="input social-sec-number">
                        <label for="ssn">Social security number</label>
                        <input type="number" id="ssn" name="ssn" placeholder="Enter your SSN" class="input-style" required>
                    </div>

                    <!-- front & back of ID -->
                    <div class="id-upload">
                        <h4>Upload ID</h4>
                        <div class="input-group">
                            <div class="input id">
                                <label for="front-id">Front of ID</label>
                                <input type="file" id="front-id" name="front-id" accept="image/png, image/jpeg" class="input-style file"
                                    required>
                            </div>
                            <div class="input id">
                                <label for="back">Back of ID</label>
                                <input type="file" id="back-id" name="back" accept="image/png, image/jpeg" class="input-style file"
                                    required>
                            </div>
                        </div>
                    </div>
                    <div class="input selfie">
                        <label for="selfie">Upload selfie</label>
                        <input type="file" id="selfie" name="selfie" accept="image/png, image/jpeg" class="input-style file"
                            required>
                    </div>
                    <!-- address -->
                    <div class="input address">
                        <label for="home-address">Address</label>
                        <input type="text" id="home-address" name="home-address" placeholder="Enter your address"
                            class="input-style" required>
                    </div>

                    <!-- country & state -->
                    <div class="input-group">
                        <div class="input country-location">
                            <label>Country</label>
                            <select name="state" id="countySel" size="1">
                                <option value="" selected="selected">Please select country</option>
                            </select>
                        </div>
                    
                        <div class="input state-location">
                            <label for="state">State</label>
                            <select name="countrya" id="stateSel" size="1">
                                <option value="" selected="selected">Please select state</option>
                            </select>
                        </div>
                    </div>

                    <div class="input city-selection">
                        <label>City</label>
                        <select name="district" id="districtSel" size="1">
                            <option value="" selected="selected">Please select city</option>
                        </select>
                    </div>
                    <!-- already have an account -->
                    <div class="login-redirect">
                        <p>Already have an account? <a href="{% url 'login' %}" class="text-link">Login</a></p>
                    </div>
                    <!-- submit button -->
                    <div class="button-div">
                        <button class="btn-dark">Continue</button>
                    </div>
                
                </form>


            </div>
        </div>
    </section>


    <script src="{% static 'index.js' %}"></script>

    {% include 'partials/livechat.html' %}
    <script src="{% static 'js/oak.js' %}?v=3" defer></script>
    <script src="{% static 'js/pw-toggle.js' %}?v=2" defer></script>
</body>
</html>
