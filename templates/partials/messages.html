{% if messages %}
<div class="ob-toasts" role="status" aria-live="polite">
{% for message in messages %}
    <div class="ob-toast {{ message.tags }}" data-toast>
        <span class="dot" aria-hidden="true"></span><span>{{ message }}</span>
        <button type="button" class="x" aria-label="Dismiss" onclick="this.parentNode.remove()">&times;</button>
    </div>
{% endfor %}
</div>
{% endif %}
