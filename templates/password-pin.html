<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Loom</title>

    <style>
        .material-symbols-rounded {
            cursor: pointer;
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 48
        }
    </style>

    <!-- Google symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'reset.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href={% static 'responsive.css' %}">
    
</head>
<body>
    
    <header id="sign-up-header">
        <!-- Top navigation -->
        <div class="nav-container">
            <a href="{% url 'home' %}" rel="logo">
                <img src="{% static 'icons/logo.png' %}">
            </a>
            <nav class="nav">
                <ul class="nav-links">
                    <li><a href="{% url 'about' %}" rel="about">About Us</a></li>
                    <li><a href="#">Our offices</a></li>
                    <li><a href="#">Contact us</a></li>
                </ul>
            </nav>
            <div class="ham-menu">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <!-- Mobile navigation menu -->
            <div class="mobile-navigation-menu">
                <!-- Navigation links -->
                <div class="links-mobile-group">
                    <nav class="mobile-nav">
                        <ul class="nav-links mobile">
                            <li><a href="#">About us</a></li>
                            <li><a href="#">Our Offices</a></li>
                            <li><a href="#">Contact us</a></li>
                        </ul>
                    </nav>
                </div>
                
            </div>
        </div>
    </header>

    <!-- Sign up section -->
    <section id="signup-form-section">
        <div class="container signup">
            <div class="vector-div">
                <img src="images/signup-image-man-standing.svg">
            </div>

            <div class="signup-form">
                <h2>Set password and transaction pin</h2>
                <form class="forms">
                    <!-- set password -->
                    <div class="input">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Set your password"
                            class="input-style" required>
                    </div>

                    <!-- confirm password -->
                    <div class="input">
                        <label for="password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password"
                            class="input-style" required>
                    </div>

                    <!-- set transaction pin -->
                    <div class="input">
                        <label for="pin">Transaction pin</label>
                        <input type="password" id="pin" name="pin" placeholder="Set transaction pin" maxlength="4"
                            class="input-style" required>
                    </div>

                    <!-- confirm transaction pin -->
                    <div class="input">
                        <label for="confirm-pin">Confirm pin</label>
                        <input type="password" id="confirm-pin" name="confirm-pin" placeholder="Confirm transaction pin" maxlength="4"
                            class="input-style" required>
                    </div>

                    <!-- don't have an account -->
                    <div class="login-redirect">
                        <p>Don't have an account? <a href="{% url 'signup' %}" class="text-link">Sign up</a></p>
                    </div>
                    <!-- submit button -->
                    <div class="button-div">
                        <button class="btn-dark">Continue</button>
                    </div>
                </form>
                

            </div>
        </div>
    </section>


    <script src="{% static 'index.js' %}"></script>
</body>
</html>
