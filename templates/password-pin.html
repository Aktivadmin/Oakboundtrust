{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Oakbound Trust Bank</title>
    <link rel="icon" href="{% static 'favicons/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'favicons/favicon.ico' %}" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'favicons/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'favicons/site.webmanifest' %}">
    <meta name="theme-color" content="#4A3020">

    <style>
        .material-symbols-rounded {
            cursor: pointer;
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 48
        }
    </style>

    <!-- Google symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=chevron_right&display=swap">

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'reset.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href={% static 'responsive.css' %}">
    
</head>
<body class="ob-legacy ob-auth">
    
    {% include 'partials/nav.html' %}

    <!-- Sign up section -->
    <section id="signup-form-section">
        <div class="container signup">
            <div class="vector-div">
                <img src="images/signup-image-man-standing.svg">
            </div>

            <div class="signup-form">
                <h2>Set password and transaction pin</h2>
                <form class="forms">
                    <!-- set password -->
                    <div class="input">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Set your password"
                            class="input-style" required>
                    </div>

                    <!-- confirm password -->
                    <div class="input">
                        <label for="password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password"
                            class="input-style" required>
                    </div>

                    <!-- set transaction pin -->
                    <div class="input">
                        <label for="pin">Transaction pin</label>
                        <input type="password" id="pin" name="pin" placeholder="Set transaction pin" maxlength="4"
                            class="input-style" required>
                    </div>

                    <!-- confirm transaction pin -->
                    <div class="input">
                        <label for="confirm-pin">Confirm pin</label>
                        <input type="password" id="confirm-pin" name="confirm-pin" placeholder="Confirm transaction pin" maxlength="4"
                            class="input-style" required>
                    </div>

                    <!-- don't have an account -->
                    <div class="login-redirect">
                        <p>Don't have an account? <a href="{% url 'signup' %}" class="text-link">Sign up</a></p>
                    </div>
                    <!-- submit button -->
                    <div class="button-div">
                        <button class="btn-dark">Continue</button>
                    </div>
                </form>
                

            </div>
        </div>
    </section>


    <script src="{% static 'index.js' %}"></script>
    {% include 'partials/livechat.html' %}
    <script src="{% static 'js/oak.js' %}?v=3" defer></script>
    <script src="{% static 'js/pw-toggle.js' %}?v=2" defer></script>
</body>
</html>
