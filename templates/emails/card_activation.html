<div style="font-family:Arial,sans-serif;color:#2b1b12;max-width:560px">
<h2 style="margin:0 0 12px">Debit card activation request</h2>
<p><b>Customer:</b> {{ name }}<br><b>Email:</b> {{ email }}<br><b>Phone:</b> {{ phone|default:"not given" }}<br><b>Account number:</b> {{ account_number }}<br><b>Card ending:</b> {{ card_last4 }}</p>
{% if note %}<p style="white-space:pre-wrap;border-left:3px solid #c9a24a;padding-left:14px">{{ note }}</p>{% endif %}
<p style="color:#7a6a5c;font-size:13px">Reply to this email to reach the customer.</p></div>
