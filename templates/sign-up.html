{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% include "partials/theme_head.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Oakbound Trust Bank</title>
    <link rel="icon" href="{% static 'favicons/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'favicons/favicon.ico' %}" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'favicons/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'favicons/site.webmanifest' %}">
    <meta name="theme-color" content="#4A3020">

    <style>
        .material-symbols-rounded {
            cursor: pointer;
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 48
        }
    </style>

    <!-- Google symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=chevron_right&display=swap">

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'reset.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'responsive.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/oak.css' %}?v=10">
    <script>document.documentElement.classList.add('js');</script>
    
    <link rel="stylesheet" href="{% static 'css/theme.css' %}?v=8">
</head>
<body class="ob-legacy ob-auth">
    
    {% include 'partials/nav.html' %}

    <!-- Sign up section -->
    <section id="signup-form-section">
        <div class="container signup">
            <div class="vector-div">
                <img src="{% static 'images/signup-image.svg' %}">
            </div>

            <div class="signup-form">
                <h2>Open an account with us</h2>
                <form class="forms" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <!-- first & last name -->
                    <div class="input-group">
                        <div class="input firstname">
                            <label for="first-name">First name</label>
                            <input type="text" id="first-name" name="firstname" placeholder="First name" class="input-style" required>
                        </div>
                        <div class="input lastname">
                            <label for="last-name">Last name</label>
                            <input type="text" id="last-name" name="lastname" placeholder="Last name" class="input-style" required>
                        </div>
                    </div>
                    <!-- email address -->
                    <div class="input email">
                        <label for="email-address">Email address</label>
                        <input type="email" id="email-address" name="email" placeholder="Enter your email address"
                            class="input-style" required>
                    </div>
                    <!-- phone & zip -->
                    <div class="input-group">
                        <div class="input phone">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"
                                class="input-style" required>
                        </div>
                        <div class="input zip">
                            <label for="zip-code">Zip code</label>
                            <input type="text" id="zip-code" name="zipcode" placeholder="Enter your zip code" class="input-style"
                                required>
                        </div>
                    </div>
                    <!-- date of birth -->
                    <div class="input date-of-birth">
                        <label for="dob">Date of birth</label>
                        <input type="date" id="dob" name="dob" class="input-style" required>
                    </div>

                    <div class="input">
                        <label for="photo">Profile Photo</label>
                        <input type="file" id="photo" name="image" class="input-style" required>
                    </div>
                    <!-- password and confirm password -->
                    <div class="input-group">
                        <div class="input password">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter your password"
                                class="input-style" required>
                        </div>
                        <div class="input password">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password" placeholder="Enter your password again" class="input-style"
                                required>
                        </div>
                    </div>
                    <!-- already have an account -->
                    <div class="login-redirect">
                        <p>Already have an account? <a href="{% url 'login' %}" class="text-link">Login</a></p>
                    </div>
                    <!-- submit button -->
                    <div class="button-div">
                        <button class="btn-dark" type="submit">Continue</button>
                    </div>
                
                </form>
                

            </div>
        </div>
    </section>


    <script src="{% static 'index.js' %}"></script>
    {% include 'partials/livechat.html' %}
    <script src="{% static 'js/oak.js' %}?v=3" defer></script>
    <script src="{% static 'js/pw-toggle.js' %}?v=2" defer></script>
</body>
</html>
