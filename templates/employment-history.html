{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Oakbound Trust Bank</title>
    <link rel="icon" href="{% static 'favicons/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'favicons/favicon.ico' %}" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'favicons/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'favicons/site.webmanifest' %}">
    <meta name="theme-color" content="#4A3020">

    <style>
        .material-symbols-rounded {
            cursor: pointer;
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 48
        }
    </style>

    <!-- Google symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=chevron_right&display=swap">

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'reset.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'responsive.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/oak.css' %}?v=9">
    <script>document.documentElement.classList.add('js');</script>
    
</head>
<body class="ob-legacy ob-auth">
    
    {% include 'partials/nav.html' %}

    <!-- Sign up section -->
    <section id="signup-form-section">
        <div class="container signup">
            <div class="vector-div">
                <img src="{% static 'images/signup-image.svg' %}">
            </div>

            <div class="signup-form">
                <h2>Employment history</h2>
                <form class="forms">
                    <!-- name of employer -->
                    <div class="input name-employer">
                        <label for="employer-name">Full name of employer</label>
                        <input type="text" id="employer-name" name="employer-name" placeholder="Employer's full name"
                            class="input-style" required>
                    </div>

                    <!-- address of employer -->
                    <div class="input address-employer">
                        <label for="employer-address">Addreess of employer</label>
                        <input type="text" id="employer-address" name="employer-address" placeholder="Employee's address"
                            class="input-style" required>
                    </div>

                    <!-- type of employer -->
                    <div class="input type-employer">
                        <label for="employer-type">Type of employer</label>
                        <input type="text" id="employer-type" name="employer-type" placeholder="Type of employer"
                            class="input-style" required>
                    </div>

                    <!-- Salary range -->
                    <div class="input salary">
                        <label for="salary-range">Salary range</label>
                        <select name="salary-range" id="salary-range">
                            <datalist id="salary-range">
                                <option value="">Select a salary range</option>
                                <option value="$0 - $25,000">$0 - $25,000</option>
                                <option value="$25,000 - $50,000">$25,000 - $50,000</option>
                                <option value="$50,000 - $100,000">$50,000 - $100,000</option>
                                <option value="$50,000 - $100,000">$50,000 - $100,000</option>
                                <option value="$50,000 - $100,000">$50,000 - $100,000</option>
                            </datalist>

                        </select>
                    </div>
                    <!-- don't have an account -->
                    <div class="login-redirect">
                        <p>Don't have an account? <a href="{% url 'signup' %}" class="text-link">Sign up</a></p>
                    </div>
                    <!-- submit button -->
                    <div class="button-div">
                        <button class="btn-dark">Continue</button>
                    </div>
                </form>
                

            </div>
        </div>
    </section>


    <script src="{% static 'index.js' %}"></script>
    
    {% include 'partials/livechat.html' %}
    <script src="{% static 'js/oak.js' %}?v=3" defer></script>
    <script src="{% static 'js/pw-toggle.js' %}?v=2" defer></script>
</body>
</html>
