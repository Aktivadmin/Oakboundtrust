{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oakbound Trust Bank</title>
    <link rel="icon" href="{% static 'favicons/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'favicons/favicon.ico' %}" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'favicons/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'favicons/site.webmanifest' %}">
    <meta name="theme-color" content="#4A3020">

    <style>
        .material-symbols-rounded {
            cursor: pointer;
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 48
        }
    </style>

    <!-- Google symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=chevron_right&display=swap">

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'reset.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href={% static 'responsive.css' %}">
    
</head>
<body class="ob-legacy ob-auth">
    
    {% include 'partials/nav.html' %}

    <!-- Sign up section -->
    <section id="signup-form-section">
        <div class="container signup">
            <div class="vector-div">
                <img src="images/signup-image.svg">
            </div>

            <div class="signup-form">
                <h2>Security questions</h2>
                <form class="forms">
                    <!-- pet's name -->
                    <div class="input name-pet">
                        <label for="pet-name">What is your pet's name?</label>
                        <input type="text" id="pet-name" name="pet-name" placeholder="Your pet's name"
                            class="input-style" required>
                    </div>

                    <!-- nickname -->
                    <div class="input your-nickname">
                        <label for="nickname">What is your nickname?</label>
                        <input type="text" id="nickname" name="nickname" placeholder="Your nickname"
                            class="input-style" required>
                    </div>

                    <!-- favorite movie -->
                    <div class="input movie-fav">
                        <label for="fav-movie">What is your favorite movie?</label>
                        <input type="text" id="fav-movie" name="fav-movie" placeholder="Your favorite movie"
                            class="input-style" required>
                    </div>

                    <!-- don't have an account -->
                    <div class="login-redirect">
                        <p>Don't have an account? <a href="{% url 'signup' %}" class="text-link">Sign up</a></p>
                    </div>
                    <!-- submit button -->
                    <div class="button-div">
                        <button class="btn-dark">Continue</button>
                    </div>
                </form>
                

            </div>
        </div>
    </section>


    <script src="{% static 'index.js' %}"></script>
    {% include 'partials/livechat.html' %}
    <script src="{% static 'js/oak.js' %}?v=3" defer></script>
    <script src="{% static 'js/pw-toggle.js' %}?v=2" defer></script>
</body>
</html>
